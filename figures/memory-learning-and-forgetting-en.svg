<svg xmlns="http://www.w3.org/2000/svg" width="960" height="498" viewBox="0 0 960 498" role="img" aria-labelledby="title desc"><title id="title">Instruction retention</title><desc id="desc">The same general instruction test, not a memory score. Four model states; the axis starts at zero.</desc><rect width="960" height="498" fill="white"/><g fill="black" font-family="Commissioner, sans-serif"><text x="40" y="45" font-size="23">Instruction retention</text><text x="40" y="75" font-size="15">Correct responses out of 25</text><text x="40" y="115" font-size="17">Before fine-tuning</text><rect x="40" y="129" width="745" height="18" fill="#eee"/><rect x="40" y="129" width="685.4" height="18" fill="black"/><text x="920" y="144" text-anchor="end" font-size="17">23</text><text x="40" y="197" font-size="17">Memory only</text><rect x="40" y="211" width="745" height="18" fill="#eee"/><rect x="40" y="211" width="149" height="18" fill="black"/><text x="920" y="226" text-anchor="end" font-size="17">5</text><text x="40" y="279" font-size="17">Memory with replay</text><rect x="40" y="293" width="745" height="18" fill="#eee"/><rect x="40" y="293" width="685.4" height="18" fill="black"/><text x="920" y="308" text-anchor="end" font-size="17">23</text><text x="40" y="361" font-size="17">Stronger memory with replay</text><rect x="40" y="375" width="745" height="18" fill="#eee"/><rect x="40" y="375" width="596" height="18" fill="black"/><text x="920" y="390" text-anchor="end" font-size="17">20</text><path d="M40 416 H785" stroke="#aaa"/><text x="40" y="438" font-size="14">0</text><text x="785" y="438" text-anchor="end" font-size="14">25</text><text x="40" y="475" font-size="14">Measured values · Conditions and limitations in the paper</text></g></svg>
