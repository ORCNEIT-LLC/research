<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Dialogue fine-tuning comparison</title><desc id="desc">Correct responses: 0 to 43. Severe degeneration: 238 to 36. Normal termination: 18 to 239. All counts out of 256.</desc><rect width="960" height="520" fill="white"/><g font-family="Commissioner, sans-serif" fill="black"><text x="60" y="45" font-size="25" >Dialogue fine-tuning</text><text x="60" y="75" font-size="16" >128 tasks × 2 generation modes · 256 responses per model</text><text x="60" y="135" font-size="17" >Correct responses ↑</text><rect x="265" y="147" width="570" height="18" fill="#f2f2f2"/><rect x="265" y="147" width="0.00" height="18" fill="#aaa"/><text x="855" y="162" font-size="14" >0 / 256</text><rect x="265" y="174" width="570" height="18" fill="#f2f2f2"/><rect x="265" y="174" width="95.74" height="18" fill="black"/><text x="855" y="189" font-size="14" >43 / 256</text><text x="60" y="243" font-size="17" >Severe degeneration ↓</text><rect x="265" y="255" width="570" height="18" fill="#f2f2f2"/><rect x="265" y="255" width="529.92" height="18" fill="#aaa"/><text x="855" y="270" font-size="14" >238 / 256</text><rect x="265" y="282" width="570" height="18" fill="#f2f2f2"/><rect x="265" y="282" width="80.16" height="18" fill="black"/><text x="855" y="297" font-size="14" >36 / 256</text><text x="60" y="351" font-size="17" >Normal termination ↑</text><rect x="265" y="363" width="570" height="18" fill="#f2f2f2"/><rect x="265" y="363" width="40.08" height="18" fill="#aaa"/><text x="855" y="378" font-size="14" >18 / 256</text><rect x="265" y="390" width="570" height="18" fill="#f2f2f2"/><rect x="265" y="390" width="532.15" height="18" fill="black"/><text x="855" y="405" font-size="14" >239 / 256</text><text x="60" y="485" font-size="16" >Grey: before · Black: after · Combined assistant gate: failed</text></g></svg>
