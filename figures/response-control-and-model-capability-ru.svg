<svg xmlns="http://www.w3.org/2000/svg" width="960" height="334" viewBox="0 0 960 334" role="img" aria-labelledby="title desc"><title id="title">Тяжёлые нарушения генерации</title><desc id="desc">Августовское парное сравнение на одной модели с неизменными весами: 400 запросов × 4 режима. Это механические нарушения генерации, не смысловая правильность.</desc><rect width="960" height="334" fill="white"/><g fill="black" font-family="Commissioner, sans-serif"><text x="40" y="45" font-size="23">Тяжёлые нарушения генерации</text><text x="40" y="75" font-size="15">Ответов из 1 600; меньше — лучше</text><text x="40" y="115" font-size="17">Без внешней защиты</text><rect x="40" y="129" width="745" height="18" fill="#eee"/><rect x="40" y="129" width="232.346875" height="18" fill="black"/><text x="920" y="144" text-anchor="end" font-size="17">499</text><text x="40" y="197" font-size="17">С внешней защитой</text><rect x="40" y="211" width="745" height="18" fill="#eee"/><rect x="40" y="211" width="201.615625" height="18" fill="black"/><text x="920" y="226" text-anchor="end" font-size="17">433</text><path d="M40 252 H785" stroke="#aaa"/><text x="40" y="274" font-size="14">0</text><text x="785" y="274" text-anchor="end" font-size="14">1 600</text><text x="40" y="311" font-size="14">Измеренные значения · Условия и ограничения в статье</text></g></svg>
