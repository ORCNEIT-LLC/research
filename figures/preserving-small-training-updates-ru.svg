<svg xmlns="http://www.w3.org/2000/svg" width="960" height="334" viewBox="0 0 960 334" role="img" aria-labelledby="title desc"><title id="title">Отклонение записи обновления</title><desc id="desc">Меньше — лучше. Измерение первого шага на одинаковых реальных весах и градиентах. Это среднее знаковое отклонение, не средняя абсолютная ошибка каждого веса и не качество ответов.</desc><rect width="960" height="334" fill="white"/><g fill="black" font-family="Commissioner, sans-serif"><text x="40" y="45" font-size="23">Отклонение записи обновления</text><text x="40" y="75" font-size="15">|Средняя знаковая ошибка|</text><text x="40" y="115" font-size="17">Округление к ближайшему</text><rect x="40" y="129" width="745" height="18" fill="#eee"/><rect x="40" y="129" width="722.6499999999999" height="18" fill="black"/><text x="920" y="144" text-anchor="end" font-size="17">7.76e-8</text><text x="40" y="197" font-size="17">Стохастическое округление</text><rect x="40" y="211" width="745" height="18" fill="#eee"/><rect x="40" y="211" width="7.990125" height="18" fill="black"/><text x="920" y="226" text-anchor="end" font-size="17">8.58e-10</text><path d="M40 252 H785" stroke="#aaa"/><text x="40" y="274" font-size="14">0</text><text x="785" y="274" text-anchor="end" font-size="14">8.00e-8</text><text x="40" y="311" font-size="14">Измеренные значения · Условия и ограничения в статье</text></g></svg>
