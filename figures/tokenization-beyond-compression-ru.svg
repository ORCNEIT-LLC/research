<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" aria-labelledby="title desc"><title id="title">Результат пробного обучения</title><desc id="desc">Три варианта на одинаковом исходном тексте. Показатель нормирован по байтам; ось начинается с нуля. Это прогнозирование текста пробной моделью, не качество готового ассистента.</desc><rect width="960" height="416" fill="white"/><g fill="black" font-family="Commissioner, sans-serif"><text x="40" y="45" font-size="23">Результат пробного обучения</text><text x="40" y="75" font-size="15">Бит на байт; меньше — лучше</text><text x="40" y="115" font-size="17">Лидер по сжатию</text><rect x="40" y="129" width="745" height="18" fill="#eee"/><rect x="40" y="129" width="707.6421614033396" height="18" fill="black"/><text x="920" y="144" text-anchor="end" font-size="17">2,374638</text><text x="40" y="197" font-size="17">Второй вариант</text><rect x="40" y="211" width="745" height="18" fill="#eee"/><rect x="40" y="211" width="684.8435777272205" height="18" fill="black"/><text x="920" y="226" text-anchor="end" font-size="17">2,298133</text><text x="40" y="279" font-size="17">Выбранный вариант</text><rect x="40" y="293" width="745" height="18" fill="#eee"/><rect x="40" y="293" width="681.8949194753559" height="18" fill="black"/><text x="920" y="308" text-anchor="end" font-size="17">2,288238</text><path d="M40 334 H785" stroke="#aaa"/><text x="40" y="356" font-size="14">0</text><text x="785" y="356" text-anchor="end" font-size="14">2,5</text><text x="40" y="393" font-size="14">Измеренные значения · Условия и ограничения в статье</text></g></svg>
