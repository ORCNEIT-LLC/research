<svg xmlns="http://www.w3.org/2000/svg" width="960" height="498" viewBox="0 0 960 498" role="img" aria-labelledby="title desc"><title id="title">Сохранение выполнения инструкций</title><desc id="desc">Один и тот же общий тест инструкций. Это не оценка памяти. Четыре состояния модели; ось начинается с нуля.</desc><rect width="960" height="498" fill="white"/><g fill="black" font-family="Commissioner, sans-serif"><text x="40" y="45" font-size="23">Сохранение выполнения инструкций</text><text x="40" y="75" font-size="15">Правильных ответов из 25</text><text x="40" y="115" font-size="17">До дообучения</text><rect x="40" y="129" width="745" height="18" fill="#eee"/><rect x="40" y="129" width="685.4" height="18" fill="black"/><text x="920" y="144" text-anchor="end" font-size="17">23</text><text x="40" y="197" font-size="17">Только память</text><rect x="40" y="211" width="745" height="18" fill="#eee"/><rect x="40" y="211" width="149" height="18" fill="black"/><text x="920" y="226" text-anchor="end" font-size="17">5</text><text x="40" y="279" font-size="17">Память и повторение</text><rect x="40" y="293" width="745" height="18" fill="#eee"/><rect x="40" y="293" width="685.4" height="18" fill="black"/><text x="920" y="308" text-anchor="end" font-size="17">23</text><text x="40" y="361" font-size="17">Усиленное обучение с повторением</text><rect x="40" y="375" width="745" height="18" fill="#eee"/><rect x="40" y="375" width="596" height="18" fill="black"/><text x="920" y="390" text-anchor="end" font-size="17">20</text><path d="M40 416 H785" stroke="#aaa"/><text x="40" y="438" font-size="14">0</text><text x="785" y="438" text-anchor="end" font-size="14">25</text><text x="40" y="475" font-size="14">Измеренные значения · Условия и ограничения в статье</text></g></svg>
